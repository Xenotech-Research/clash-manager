# Clash Manager 前端 + API 转发（后端 9988）

server {
    listen       80;
    server_name  prox.xenotech.studio;
    root         html;

    location / {
        root   /home/ubuntu/clash-manager/web/dist;
        index  index.html index.htm;
        access_log  /home/ubuntu/clash-manager/logs/access.log;
        autoindex on;
        try_files $uri /index.html;
    }

    location /api {
        proxy_pass  http://127.0.0.1:9988;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    error_log  /home/ubuntu/clash-manager/logs/error.log;
}

server {
    listen       443 ssl;
    server_name  prox.xenotech.studio;

    ssl_certificate     /home/ubuntu/__ssl__/xenotech.studio/xenotech.studio_bundle.pem;
    ssl_certificate_key  /home/ubuntu/__ssl__/xenotech.studio/xenotech.studio.key;
    ssl_session_timeout  5m;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50m;

    location / {
        root   /home/ubuntu/clash-manager/web/dist;
        index  index.html index.htm;
        access_log  /home/ubuntu/clash-manager/logs/access.log;
        autoindex on;
        try_files $uri /index.html;
    }

    location /api {
        proxy_pass  http://127.0.0.1:9988;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    error_log  /home/ubuntu/clash-manager/logs/error.log;
}
